  ["2. 資料用途", ["確認你是香港大學生並年滿 18 歲；", "每週配對：用問卷、條件和理想型計算契合度，並用年齡、身高等條件篩選；族裔只作展示，不會用來篩選；", "向你的配對對象展示配對卡；運作聊天；", "發送登入驗證碼；處理舉報，保障用戶安全。"], "我們不會出售你的資料，不會用作直接促銷，亦不會放廣告。我們現時不會用 AI 分析你的文字；如日後使用，會先更新本政策並通知你。"],
  ["3. 誰可以看到你的資料", ["其他用戶：只有當週的配對對象可以看到你的配對卡，包括名字、學校、學系、年級、年齡、身高、照片、自我介紹、性格興趣和理想型，以及根據你們相同答案列出的「為甚麼合適」。電郵、暗戀清單和封鎖名單不會給任何用戶看到。", "暗戀清單和封鎖名單：只保存電郵經過不可還原處理後的「指紋」和打碼後的顯示；對方永遠不會知道，除非雙方都寫了對方。", "服務供應商（只按我們的指示處理資料）：Supabase（資料庫、登入、照片儲存，伺服器位於新加坡）、Resend（發送驗證碼電郵，位於美國）、Vercel（網站寄存）。網站亦會從 jsDelivr 和 Google Fonts 載入程式庫和字型，它們會收到你的 IP 位址等一般網絡資料。", "執法機構：只在法律要求時提供。"]],
  ["4. 資料存放在香港以外", "你的資料會存放及處理於香港以外的地方，包括新加坡和美國。我們會選用有適當保安措施的供應商。"],
  ["5. 保存多久", ["聊天內容和破冰答案：聊天關閉 30 天後自動刪除。", "個人資料和照片：保存至你刪除帳戶。", "配對紀錄（用來避免重複配對）：保存至其中一方刪除帳戶。", "刪除帳戶：帳戶、個人資料、照片、配對、聊天、暗戀和封鎖名單會即時刪除。舉報內容（包括舉報人自願附上的聊天內容）會保留最多 12 個月以處理安全問題，但會與已刪除的帳戶斷開連結。"]],
  ["6. 資料保安", "資料庫設有權限控制，每位用戶只可以讀取自己有權看的資料；照片為私密儲存，只會以限時連結顯示給你本人和當週配對對象。聊天內容端對端加密：訊息在你的裝置上加密，只有你和配對對象的裝置能解開，私鑰從不離開你的裝置，伺服器只儲存密文，我們和任何管理員都無法讀取。舉報時，舉報人可以自願附上自己裝置解開的聊天內容（連同可核實真偽的訊息鑰匙），我們只會用來處理該宗舉報。破冰答案和配對卡資料需要由系統處理，因此不屬於端對端加密範圍。"],
  ["7. 你的權利", "你有權查閱和更正你的個人資料。大部分資料可以直接在「我的」頁修改或刪除；如需索取資料副本或有其他要求，請電郵 {email}，我們會在 40 日內回覆。"],
  ["8. 未滿 18 歲", "本服務只供 18 歲或以上人士使用。如發現用戶未滿 18 歲，我們會刪除其帳戶。"],
  ["9. 政策更新", "我們可能更新本政策。重大變更會在網站上通知。"],
  ["10. 聯絡我們", "私隱相關查詢，請電郵 {email}。"]
]},
zhs: { t: "私隐政策", lead: "本政策（也作为《收集个人资料声明》）说明我们收集什么资料、用来做什么、谁能看到，以及你根据香港《个人资料（私隐）条例》（第 486 章）享有的权利。", s: [
  ["1. 我们收集的资料", "必填（不提供就无法使用配对服务）：", ["学校邮箱（用来登录及确认学生身份）", "名字、性别、出生年份、学系、年级、身高、来自哪里、语言", "照片 1 至 3 张", "性格、兴趣、问卷答案、理想型及配对条件（年龄、身高范围等）"], "选填：族裔、MBTI、宗教、是否抽烟、自我介绍、对理想型的文字描述、暗恋清单、屏蔽名单。", "使用期间产生：每周报名、配对结果和你的选择、破冰答案、经端到端加密的聊天内容（我们无法读取）、每部设备的加密公钥、举报（包括你举报时自愿附上的聊天内容）。"],
  ["2. 资料用途", ["确认你是香港大学生并年满 18 岁；", "每周配对：用问卷、条件和理想型计算契合度，并用年龄、身高等条件筛选；族裔只作展示，不会用来筛选；", "向你的配对对象展示配对卡；运作聊天；", "发送登录验证码；处理举报，保障用户安全。"], "我们不会出售你的资料，不会用作直接促销，也不会放广告。我们目前不会用 AI 分析你的文字；如日后使用，会先更新本政策并通知你。"],
  ["3. 谁能看到你的资料", ["其他用户：只有当周的配对对象能看到你的配对卡，包括名字、学校、学系、年级、年龄、身高、照片、自我介绍、性格兴趣和理想型，以及根据你们相同答案列出的「为什么合适」。邮箱、暗恋清单和屏蔽名单不会给任何用户看到。", "暗恋清单和屏蔽名单：只保存邮箱经过不可还原处理后的「指纹」和打码后的显示；对方永远不会知道，除非双方都写了对方。", "服务供应商（只按我们的指示处理资料）：Supabase（数据库、登录、照片存储，服务器位于新加坡）、Resend（发送验证码邮件，位于美国）、Vercel（网站托管）。网站也会从 jsDelivr 和 Google Fonts 加载程序库和字体，它们会收到你的 IP 地址等一般网络资料。", "执法机构：只在法律要求时提供。"]],
  ["4. 资料存放在香港以外", "你的资料会存放及处理于香港以外的地方，包括新加坡和美国。我们会选用有适当安全措施的供应商。"],
  ["5. 保存多久", ["聊天内容和破冰答案：聊天关闭 30 天后自动删除。", "个人资料和照片：保存到你删除账号。", "配对记录（用来避免重复配对）：保存到其中一方删除账号。", "删除账号：账号、个人资料、照片、配对、聊天、暗恋和屏蔽名单会即时删除。举报内容（包括举报人自愿附上的聊天内容）会保留最多 12 个月以处理安全问题，但会与已删除的账号断开关联。"]],
  ["6. 资料安全", "数据库设有权限控制，每位用户只能读取自己有权看的资料；照片私密存储，只会以限时链接显示给你本人和当周配对对象。聊天内容端到端加密：消息在你的设备上加密，只有你和配对对象的设备能解开，私钥从不离开你的设备，服务器只存储密文，我们和任何管理员都无法读取。举报时，举报人可以自愿附上自己设备解开的聊天内容（连同可核实真伪的消息钥匙），我们只会用来处理该宗举报。破冰答案和配对卡资料需要由系统处理，因此不属于端到端加密范围。"],
  ["7. 你的权利", "你有权查阅和更正你的个人资料。大部分资料可以直接在「我的」页修改或删除；如需索取资料副本或有其他要求，请发邮件到 {email}，我们会在 40 日内回复。"],
  ["8. 未满 18 岁", "本服务只供 18 岁或以上人士使用。如发现用户未满 18 岁，我们会删除其账号。"],
  ["9. 政策更新", "我们可能更新本政策。重大变更会在网站上通知。"],
  ["10. 联系我们", "私隐相关查询，请发邮件到 {email}。"]
]},
en: { t: "Privacy policy", lead: "This policy (which is also our Personal Information Collection Statement) explains what we collect, why, who can see it, and your rights under Hong Kong’s Personal Data (Privacy) Ordinance (Cap. 486).", s: [
  ["1. What we collect", "Required (without these you can’t use matching):", ["Your school email, to sign you in and confirm you are a student", "Name, gender, birth year, faculty, year of study, height, where you’re from, languages", "1 to 3 photos", "Personality traits, interests, quiz answers, your ideal type and match criteria (age and height ranges, etc.)"], "Optional: ethnicity, MBTI, religion, smoking, bio, a written description of your ideal type, crush list, block list.", "Created as you use the service: weekly sign-ups, matches and your decisions, icebreaker answers, end-to-end encrypted chat messages (which we cannot read), each device's public encryption key, and reports (including any messages you choose to attach)."],
  ["2. How we use it", ["To confirm you are a Hong Kong university student aged 18 or over;", "To match you each week: we score compatibility from your quiz, criteria and ideal type, and filter by criteria such as age and height. Ethnicity is shown on your card only and is never used to filter;", "To show your match card to your match and run the chat;", "To send sign-in codes, handle reports and keep users safe."], "We don’t sell your data, use it for direct marketing, or show ads. We don’t currently use AI to analyse your text; if that changes we will update this policy and tell you first."],
  ["3. Who can see it", ["Other users: only your match for that week sees your match card — name, school, faculty, year, age, height, photos, bio, traits, interests and ideal type, plus “why you fit” based on answers you share. Your email, crush list and block list are never shown to anyone.", "Crush and block lists: we store only an irreversible fingerprint of each email plus a masked label. The other person never finds out unless you both list each other.", "Service providers, who process data only on our instructions: Supabase (database, sign-in and photo storage, servers in Singapore), Resend (sends sign-in emails, USA) and Vercel (website hosting). The site also loads code and fonts from jsDelivr and Google Fonts, which receive general network data such as your IP address.", "Law enforcement, only where the law requires it."]],
  ["4. Storage outside Hong Kong", "Your data is stored and processed outside Hong Kong, including in Singapore and the USA. We choose providers with appropriate security measures."],
  ["5. How long we keep it", ["Chat messages and icebreaker answers: deleted automatically 30 days after the chat closes.", "Profile and photos: until you delete your account.", "Match history (to avoid repeat matches): until either person deletes their account.", "When you delete your account, your account, profile, photos, matches, chats, crush list and block list are deleted immediately. Reports, including any messages the reporter chose to attach, are kept for up to 12 months for safety reasons, unlinked from deleted accounts."]],
  ["6. Security", "Database permissions mean each user can only read what they are allowed to see. Photos are stored privately and shown only to you and your match through links that expire. Chats are end-to-end encrypted: messages are encrypted on your device and only your and your match's devices can open them. Private keys never leave your device; the server stores only ciphertext, so neither we nor any admin can read them. When reporting, the reporter can choose to attach messages their own device decrypted (with per-message keys that let us verify them); we use these only to handle that report. Icebreaker answers and match-card details are processed by our system, so they are not end-to-end encrypted."],
  ["7. Your rights", "You have the right to access and correct your personal data. You can edit or delete most of it yourself on the Me page. For a copy of your data or any other request, email {email} — we will reply within 40 days."],
  ["8. Under 18s", "The service is only for people aged 18 or over. If we find a user is under 18, we delete their account."],
  ["9. Changes", "We may update this policy and will announce major changes on the site."],
  ["10. Contact", "Privacy questions: {email}."]
]}
},

/* ---------- end-to-end encrypted chat ----------
   Each browser makes its own ECDH P-256 key pair; the private key is non-extractable and stays in IndexedDB.
   A message is encrypted once with a fresh AES-256-GCM key; that key is wrapped for every device of both people
   (wrapping key = HKDF(ECDH(my device, their device), info = match id)). The server only ever stores ciphertext. */
var E2E = (function () {
  var subtle = window.crypto && window.crypto.subtle;
  var te = window.TextEncoder ? new TextEncoder() : null, td = window.TextDecoder ? new TextDecoder() : null;
  var DBN = "unidate-keys", ST = "devices", mem = {}, cache = {}, wkCache = {}, volatile = false;
  function b64(buf) { var s = "", b = new Uint8Array(buf); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function unb64(s) { var bin = atob(s), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
  function rnd(n) { var b = new Uint8Array(n); window.crypto.getRandomValues(b); return b; }
  function supported() { return !!(subtle && te && td && window.crypto.getRandomValues); }

  /* key storage: IndexedDB, or memory when the browser blocks it (keys then last until the tab closes) */
  function idb() {
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open(DBN, 1);
        r.onupgradeneeded = function () { r.result.createObjectStore(ST); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
  }
  function tx(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(ST, mode), req = fn(t.objectStore(ST));
        t.oncomplete = function () { res(req && req.result); };
        t.onerror = t.onabort = function () { rej(t.error); };
      });
    });
  }
  function getKey(uid) { return tx("readonly", function (s) { return s.get(uid); }).then(function (v) { return v || null; }).catch(function () { volatile = true; return mem[uid] || null; }); }
  function putKey(uid, v) { return tx("readwrite", function (s) { return s.put(v, uid); }).catch(function () { volatile = true; mem[uid] = v; }); }
  function delKey(uid) { delete mem[uid]; delete cache[uid]; wkCache = {}; return tx("readwrite", function (s) { return s["delete"](uid); }).catch(function () {}); }

  /* this device: load or create the key pair, then make sure the server knows its public half */
  function ensure(uid, register) {
    if (!supported()) return Promise.reject(new Error("E2E_UNSUPPORTED"));
    return (cache[uid] ? Promise.resolve(cache[uid]) : getKey(uid)).then(function (me) {
      if (me && me.priv && me.pub) return me;
      return subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]).then(function (kp) {
        return subtle.exportKey("jwk", kp.publicKey).then(function (j) { return { id: null, ids: [], priv: kp.privateKey, pub: { kty: "EC", crv: "P-256", x: j.x, y: j.y } }; });
      });
    }).then(function (me) {
      return register(me.pub).then(function (id) {

function resizeImage(file, max) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function () {
      var img = new Image();
      img.onerror = reject;
      img.onload = function () {
        var sc = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * sc), h = Math.round(img.height * sc);
        var cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h);
        cv.toBlob(function (b) { if (b) resolve(b); else reject(new Error("photo")); }, "image/jpeg", 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
